version: "3.7"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: my-laravel-app:v1.0
        container_name: my-laravel-app
        restart: always
        expose:
            - 9000
        ports:
            - "9001:9000"
        environment:
            - APP_KEY=${APP_KEY}
            - APP_ENV=production
            - DB_CONNECTION=mysql
            - DB_HOST=db
            - DB_PORT=3306
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_HOST=redis
        env_file:
            - .env
        depends_on:
            - db
            - redis

    worker:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: my-laravel-worker
        restart: always
        command: php artisan queue:work --verbose --tries=3 --timeout=90
        depends_on:
            - app
            - redis
            - db
        volumes:
            - .:/var/www/html

    db:
        image: mysql:8.0
        container_name: my-laravel-db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - db-data:/var/lib/mysql

    redis:
        image: redis:alpine
        container_name: my-laravel-redis
        restart: always

volumes:
    db-data:
        driver: local
